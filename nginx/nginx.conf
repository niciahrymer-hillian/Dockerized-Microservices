# Reverse proxy: one public port (80, mapped to host 8080) fronting two
# upstreams that are invisible from outside the Docker network.
events {}

http {
  # "api" resolves via Docker's embedded DNS to the api service's container
  # IP — service discovery by name, no hardcoded IP, no /etc/hosts entry.
  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;

    # Everything under /api/ goes to FastAPI. The trailing slash on
    # proxy_pass strips "/api" before forwarding, so FastAPI sees "/jobs",
    # not "/api/jobs".
    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is the static frontend. try_files falls back to
    # index.html for any path that isn't a real file — this is the line a
    # React Router app needs so a hard refresh on a client-side route
    # (e.g. /jobs/3) doesn't 404 against nginx's filesystem.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
